# Sanitized reference derived from the user's V2 Hermes configuration.
# Replace private values before use.

model:
  default: glm-4.7-flash:latest
  provider: custom
  base_url: http://192.168.0.132:11434/v1

database:
  journal_mode: wal

agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium

terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300

web:
  backend: brave-free

browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
  cloud_provider: local

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10

delegation:
  max_iterations: 250

skills:
  creation_nudge_interval: 15

code_execution:
  timeout: 300
  max_tool_calls: 50

gateway:
  delivery_ledger: true
  loop_watchdog: true
  startup_watchdog: true
  api_server:
    max_concurrent_runs: 10
  scale_to_zero:
    idle_timeout_minutes: 2

prompt_caching:
  cache_ttl: 5m

streaming:
  enabled: false

platforms:
  whatsapp:
    enabled: true
    home_channel:
      platform: whatsapp
      chat_id: ${WHATSAPP_HOME_CHAT_ID}
      user_id: ${WHATSAPP_HOME_USER_ID}

dashboard:
  basic_auth:
    username: admin
    password_hash: ${HERMES_DASHBOARD_PASSWORD_HASH}
    secret: ${HERMES_DASHBOARD_SECRET}
